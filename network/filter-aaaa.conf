# joggo: strip AAAA for CI build containers.   ->  /etc/dnsmasq.d/joggo-filter-aaaa.conf
#
# NOT INSTALLED. This file is the proposed change, kept in the repo so it can be
# reviewed before it becomes a service on the box. See INSTALL at the bottom.
#
# THE FAULT (board C-c95; root cause confirmed 2026-10-14).
# A container created by a slot's dind daemon comes up with IPv6 enabled and a
# link-local address, while this box has no IPv6 route at all:
#
#     child disable_ipv6(all)      = 0
#     child inet6 addrs            = 1
#     child v6 default route       = (none)
#     getent hosts mirror.gcr.io  -> 2a00:1450:400c:c07::52      <-- AAAA first
#     curl to the same host       -> 401 via 74.125.133.82        <-- v4 works
#
# Because the child HAS a v6 address, glibc's AI_ADDRCONFIG does not filter AAAA,
# so DNS hands every client an address it cannot reach. Clients that fall back
# cleanly (curl, pnpm) survive. Clients that do not, fail — measured twice:
# trivy could not fetch its DB from mirror.gcr.io (C-c13), and next/font got a
# null response from fonts.googleapis.com (C-c91).
#
# WHY THE EXISTING MITIGATIONS ARE NOT ENOUGH.
#  * The VM sets net.ipv6.conf.{all,default}.disable_ipv6=1 — already true, and
#    irrelevant: the sysctl is per-netns and a new container gets kernel defaults.
#  * run-containerized-slot.sh has set --sysctl disable_ipv6=1 on the DIND
#    container since 2026-09-06. Verified: dind reads 1, its children read 0.
#    Setting default.disable_ipv6=1 inside dind does not propagate either.
#  * dockerd --dns-opt=no-aaaa (added 2026-10-14, and live) fixes GLIBC clients.
#    Verified in a child: mirror.gcr.io then resolves to 74.125.133.82. But
#    no-aaaa is a glibc option — musl ignores it, and aquasec/trivy is Alpine,
#    which is precisely the client in one of the two confirmed failures.
#
# So the resolver is the only place that covers every client regardless of libc.
#
# SCOPE, deliberately narrow. Listens ONLY on the two slot gateways, so it answers
# build containers and nothing else on this box. The WSL resolver on
# 10.255.255.254 is untouched and stays this VM's own upstream — this forwards to
# it rather than replacing it.
listen-address=10.201.1.1,10.201.2.1

# bind-dynamic, not bind-interfaces: the slot bridges are created by Docker and
# may appear after dnsmasq starts. bind-interfaces would fail to start in that
# order and leave every build container without DNS, which is a far worse outage
# than the one this fixes.
bind-dynamic

# The whole point.
filter-AAAA

# Forward to the VM's own resolver rather than reading /etc/resolv.conf, which
# WSL rewrites.
no-resolv
server=10.255.255.254

# The slot networks serve no names, and /etc/hosts here is the VM's, not the
# containers'.
no-hosts

# ---------------------------------------------------------------------------
# INSTALL (operator, inside the WSL VM as root):
#
#   cp network/filter-aaaa.conf /etc/dnsmasq.d/joggo-filter-aaaa.conf
#   dnsmasq --test                        # syntax, and that this build has filter-AAAA
#   systemctl enable --now dnsmasq
#   systemctl is-active dnsmasq
#
# Then point the slots at it by adding to the dind run in
# slots/run-containerized-slot.sh, next to the --dns-opt line:
#
#   --dns="$SLOT_GATEWAY" \
#
# and restart the idle slots so dind picks it up:
#
#   systemctl restart 'joggo-slot@*'          # only when no job is running
#
# VERIFY (expect the IPv4 address, from an ALPINE image — the musl case):
#
#   docker exec joggo-dind-1 docker -H tcp://127.0.0.1:2375 run --rm alpine:3 \
#     sh -c 'getent hosts mirror.gcr.io'
#
# ROLLBACK is one command and loses nothing:
#
#   systemctl disable --now dnsmasq && rm /etc/dnsmasq.d/joggo-filter-aaaa.conf
#
# RISK TO WEIGH BEFORE SAYING YES. This makes dnsmasq a hard dependency for every
# build container's DNS: if it stops, builds lose name resolution entirely. That
# is a worse failure than the intermittent one it fixes, so it wants the same
# watchdog treatment the runner has. The alternative with no new service is to
# give the VM a real IPv6 route, which is the larger change and fixes the cause
# rather than the symptom.
