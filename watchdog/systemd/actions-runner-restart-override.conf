# Drop-in for actions.runner.example-org.marathon.service
# Installs to:
#   /etc/systemd/system/actions.runner.example-org.marathon.service.d/override.conf
#
# GitHub's svc.sh-generated unit ships no Restart=, so a listener that exits
# (crash, or the clock-drift session failure) leaves CI dead until a human
# notices. This is self-heal layer 2.
#
# NOTE: this cannot recover a listener that HANGS instead of exiting — systemd
# only restarts on process exit. That case is layer 3, runner-watchdog.timer.
[Service]
Restart=always
RestartSec=120
